name: Release & Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v3.4.0-20261011)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write   # required for PyPI Trusted Publishing (OIDC)

concurrency:
  group: yamlguard-pypi-release
  cancel-in-progress: false

jobs:
  # ─── 1. Run full test suite before publishing ──────────────────────────────
  test:
    name: Test before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install package + test deps
        run: pip install -e . -r requirements-test.txt

      - name: Run tests
        run: pytest tests/ -v

  # ─── 2. Build the distribution packages ───────────────────────────────────
  build:
    name: Build wheel & sdist
    runs-on: ubuntu-latest
    needs: [test]
    outputs:
      dist_path: dist/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build hatchling

      - name: Build packages
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          # The packaged README uses the same range and highlights as GitHub.
          python scripts/release_notes.py --version "$RELEASE_TAG" --head HEAD \
            --repository "$GITHUB_REPOSITORY" --readme README.md
          python -m build

      - name: Generate SHA256 checksums
        run: |
          sha256sum dist/* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-checksums
          path: SHA256SUMS.txt
          retention-days: 30

      - name: Upload dist artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-release
          path: dist/
          retention-days: 30

  # ─── 3. Publish to PyPI via Trusted Publisher (OIDC) ─────────────────────
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: pypi
      url: https://pypi.org/p/yamlguard
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-release
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62e9de57f7ac337885fbfe4558 # v1.12.4
        with:
          # Using PyPI Trusted Publisher — no PYPI_TOKEN needed!
          # Set up at: https://pypi.org/manage/account/publishing/
          print-hash: true
