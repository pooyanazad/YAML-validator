[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yamlguard"
dynamic = ["version"]
description = "Validate YAML files for syntax, linting, and security issues — fast CLI tool"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "pooyanazad" },
]
keywords = [
    "yaml",
    "lint",
    "validate",
    "devops",
    "ci",
    "security",
    "checkov",
    "yamllint",
    "kubernetes",
]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
]
dependencies = [
    "yamllint>=1.26.0",
    "PyYAML>=6.0",
    "colorama>=0.4.4",
]

[project.optional-dependencies]
security = [
    "checkov>=3.0.0",
]
dev = [
    "ruff",
    "mypy",
    "black",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "pytest-json-report",
    "jsonschema",
]

[project.urls]
Homepage = "https://github.com/pooyanazad/yamlguard"
Repository = "https://github.com/pooyanazad/yamlguard"
"Bug Tracker" = "https://github.com/pooyanazad/yamlguard/issues"
Changelog = "https://github.com/pooyanazad/yamlguard/releases"

[project.scripts]
yamlguard = "yamlguard.cli:main"

[tool.hatch.version]
path = "yamlguard/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["yamlguard", "yaml_validator"]

[tool.hatch.build.targets.sdist]
include = [
    "/yamlguard",
    "/yaml_validator",
    "/tests",
    "/scripts",
    "/release-notes",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]
